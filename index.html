<!DOCTYPE html>
<html lang="en">

<head>
    <title>Personal Expense Tracker</title>
</head>

<body>


    <div class="page">
        <div id="navbar">
            <div id="navcontain">
                <div id="title">
                    <svg width="200" height="45" viewBox="0 0 200 45" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#5145ff" />
                                <stop offset="100%" stop-color="#1688ee" />
                            </linearGradient>

                            <linearGradient id="textBlue" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#55d9ff" />
                                <stop offset="100%" stop-color="#4d7cff" />
                            </linearGradient>
                        </defs>

                        <!-- Logo icon -->
                        <rect x="2" y="40" width="39" height="39" rx="9" fill="url(#logoBlue)" />

                        <!-- Bars -->
                        <rect x="11" y="25" width="5" height="11" rx="1.5" fill="white" />
                        <rect x="18" y="20" width="5" height="16" rx="1.5" fill="white" />
                        <rect x="25" y="15" width="5" height="21" rx="1.5" fill="white" />

                        <!-- Growth line -->

                        <polyline points="10,18 17,13 20,16 31,6" fill="none" stroke="white" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round" />



                        <!-- Arrow -->
                        <polyline points="26,6 31,6 31,11" fill="none" stroke="white" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round" />



                        <!-- Text -->
                        <text x="50" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="700"
                            fill="url(#textBlue)">
                            Expense Tracker
                        </text>
                    </svg>
                </div>


                <!-- NavItems -->
                <div class="nav-item active n1">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="6" height="6" rx="1" />
                        <rect x="14" y="4" width="6" height="6" rx="1" />
                        <rect x="4" y="14" width="6" height="6" rx="1" />
                        <rect x="14" y="14" width="6" height="6" rx="1" />
                    </svg>
                    <span>Dashboard</span>
                </div>

                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="17" rx="2" />
                        <path d="M8 8h8" />
                        <path d="M8 12h8" />
                        <path d="M8 16h5" />
                    </svg>
                    <span>Transactions</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 6h7l2 2h9v11H3z" />
                        <path d="M3 6v-1h7l2 2" />
                    </svg>
                    <span>Categories</span>
                </div>
                <div class="Navfooter">
                    <div id="Username"></div>
                    <div id="sign">Designed by Shubh</div>
                </div>
            </div>
        </div>




        <!-- ------------- -->

        <div id="content">
            <div id="Header">
                <div id="Headings">
                    <h1> Financial Dashboard</h1>
                    <h2> Manage Your Finances</h2>
                </div>
                <button id="Signout">Sign out</button>
            </div>
            <div id="container">

                <div id="container1" class="container">
                    <div class="logobox">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <path d="M4 16L9 11L13 14L20 7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />

                            <path d="M15 7H20V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />

                        </svg>
                    </div>
                    <div class="desc"> Total balance </div>
                    <div id="total-balance" class="amt"></div>
                </div>

                <div id="container2" class="container">
                    <div class="logobox">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <path d="M4 8L9 13L13 10L20 17" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />

                            <path d="M15 17H20V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />

                        </svg>
                    </div>
                    <div class="desc"> Total expenses</div>
                    <div id="total-expenses" class="amt"></div>
                </div>


                <div id="container3" class="container">
                    <div class="logobox">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <path d="M12 3V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

                            <path
                                d="M16 7.5C15.3 6.5 14.2 6 12.5 6C10.5 6 9 7.1 9 8.7C9 10.5 10.5 11.2 12.5 11.8L14 12.2C15.7 12.7 17 13.5 17 15.2C17 17 15.3 18 12.8 18C10.7 18 9.1 17.3 8 16"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />

                        </svg>
                    </div>
                    <div class="desc"> Total income</div>
                    <div id="total-income" class="amt"></div>
                </div>

                <div id="container4" class="container">
                    <div class="logobox">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                            <path
                                d="M4 6.5C4 5.67 4.67 5 5.5 5H18C19.1 5 20 5.9 20 7V18C20 19.1 19.1 20 18 20H6C4.9 20 4 19.1 4 18V6.5Z"
                                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />

                            <path d="M4 8H18" stroke="currentColor" stroke-width="1.8" />

                            <path d="M15 13H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />

                            <circle cx="15" cy="13" r="1" fill="currentColor" />

                        </svg>
                    </div>
                    <div class="desc"> Total savings</div>
                    <div id="total-savings" class="amt"></div>
                </div>

            </div>
            <div id="dashboard-bottom">

                <div id="transaction-form">

                    <div class="transaction-title">
                        <div class="plus-icon">+</div>
                        <span>Add Transaction</span>
                    </div>

                    <div class="input-box i1">
                        <!-- your description SVG -->
                        <input type="text" id="description" placeholder="Description">
                    </div>

                    <div class="input-box">
                        <!-- your amount SVG -->
                        <input type="number" id="amount" placeholder="Amount">
                    </div>

                    <div class="input-box">
                        <!-- your type SVG -->
                        <select id="transaction-type">
                            <option value="">select</option>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                            <option value="Saving">Saving</option>
                        </select>

                        <span class="select-arrow">⌄</span>
                    </div>
                    <button id="add-transaction">Add Transaction</button>
                    <button id="reset">Reset Past Records</button>
                </div>
                <div id="chart-container">
                    <h3>Spending Overview</h3>
                    <div id="chart-area">

                        <div id="doughnut">

                            <canvas id="chart"></canvas>

                            <div id="chart-center">

                                <div>Balance</div>

                                <strong>Rs 0.00</strong>

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="stylesheet" href="Expense.css">
        <script src="nav.js"></script>
        <script src="Expense.js"></script>
</body>

</html>
